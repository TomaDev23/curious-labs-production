<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04050d" />
<meta http-equiv="refresh" content="0; url=/maestro" />
<link rel="canonical" href="/maestro" />
<title>Opening Maestro</title>
<style>
  :root{--bg:#04050d;--ink:#dbe1f5;--mut:#8b95bd;--cyan:#4fd6ff}
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0;background:var(--bg);color:var(--ink)}
  body{
    display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{text-align:center;max-width:420px}
  a{color:var(--cyan);text-decoration:none}
  p{color:var(--mut);line-height:1.6}
</style>
</head>
<body>
  <main>
    <h1>Opening Maestro</h1>
    <p>If you are not redirected automatically, <a href="/maestro">open the Maestro page</a>.</p>
  </main>
</body>
</html>
